name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: x86
            rid: win-x86

    outputs:
      version: ${{ steps.version.outputs.version }}
      proxy_version: ${{ steps.version.outputs.proxy_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Derive version from tag and pinned proxy version from the lock file
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          $lock = Get-Content -LiteralPath tools/dnscrypt-proxy.lock.json -Raw | ConvertFrom-Json
          if (-not $lock.version) {
            throw 'could not read the pinned dnscrypt-proxy version from tools/dnscrypt-proxy.lock.json'
          }
          "proxy_version=$($lock.version)" >> $env:GITHUB_OUTPUT
          Write-Host "app version: $version, pinned dnscrypt-proxy: $($lock.version)"

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SimpleDnsCrypt.sln

      - name: Build
        run: dotnet build SimpleDnsCrypt.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test Tests/Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Assert the test run was not empty
        shell: pwsh
        run: |
          $trxPath = 'TestResults/results.trx'
          if (-not (Test-Path $trxPath)) {
            throw "no TRX produced at $trxPath - the test step did not run"
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $failed = [int]$counters.failed
          Write-Host "tests: total=$total failed=$failed passed=$([int]$counters.passed)"
          if ($total -le 0) {
            throw "test run reported 0 tests; refusing to publish an unverified release"
          }
          if ($failed -gt 0) {
            throw "$failed test(s) failed; refusing to publish"
          }

      - name: Fetch digest-pinned dnscrypt-proxy binaries
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build/fetch-proxy.ps1 -Arch ${{ matrix.arch }}

      - name: Build portable zip
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File build/build-portable.ps1
          -Arch ${{ matrix.arch }} -Version ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: staged
          merge-multiple: true

      - name: Merge per-architecture checksums into one SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cat staged/SHA256SUMS-*.txt | sort > staged/SHA256SUMS.txt
          rm -f staged/SHA256SUMS-*.txt
          echo "publishing:"; ls -la staged
          echo "checksums:"; cat staged/SHA256SUMS.txt
          # both architectures must be represented, or one zip would ship unverified
          test "$(wc -l < staged/SHA256SUMS.txt)" -ge 2

      - name: List what will be published
        shell: bash
        run: ls -la staged

      # Each artifact is signed with the release key whose public half is committed at
      # tools/keys/update.pub and compiled into the application as UpdateChannel.TrustedPublicKey.
      # pwsh, not bash: Actions echoes every bash command into the log, and this one reads the key
      # material out of the environment.
      - name: Sign each artifact with the release key
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MINISIGN_PRIVATE_KEY -or -not $env:MINISIGN_PASSWORD) {
            throw 'MINISIGN_PRIVATE_KEY / MINISIGN_PASSWORD are not set for this repository. An unsigned release is not a release: the application would refuse every artifact we publish.'
          }
          $zips = @(Get-ChildItem -LiteralPath staged -Filter *.zip)
          if ($zips.Count -lt 2) {
            throw "expected at least an x64 and an x86 artifact, found $($zips.Count)"
          }
          foreach ($zip in $zips) {
            dotnet run --project tools/minisign-tool -c Release -- sign --file $zip.FullName --signature-out "$($zip.FullName).minisig"
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($zip.Name)" }
          }

      - name: Verify the signatures with the reference minisign CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          minisign --version
          for zip in staged/*.zip; do
            echo "verifying $zip against the committed public key"
            minisign -Vm "$zip" -x "$zip.minisig" -p tools/keys/update.pub
          done

          # The check above is only worth something if it can fail. Same name, one extra byte.
          work=$(mktemp -d)
          target=$(ls -1 staged/*.zip | head -1)
          cp "$target" "$work/$(basename "$target")"
          printf 'tamper' >> "$work/$(basename "$target")"
          if minisign -Vm "$work/$(basename "$target")" -x "$target.minisig" -p tools/keys/update.pub; then
            echo "the CLI accepted a modified artifact - do not publish"
            exit 1
          fi
          echo "tampered copy rejected, as it must be"

      - name: Write the update manifests the application reads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'x64', 'x86') {
            & ./build/make-update-manifest.ps1 -Arch $arch -Version '${{ needs.build.outputs.version }}' -ArtifactDir staged
          }
          Get-ChildItem staged | Format-Table Name, Length -AutoSize

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Simple DNSCrypt Plus ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: staged/*
          body: |
            ## Simple DNSCrypt Plus ${{ needs.build.outputs.version }}

            Portable builds of this fork of [SimpleDnsCrypt](https://github.com/DNSCrypt/SimpleDnsCrypt),
            targeting .NET 10. Unzip anywhere and run `SimpleDnsCryptPlus.exe` as administrator.

            ### Verify before running
            Each zip is accompanied by a detached minisign signature made with the release key
            published in this repository as `tools/keys/update.pub`:

            ```
            minisign -Vm .\SimpleDNSCryptPlus-x64-${{ needs.build.outputs.version }}-portable.zip `
              -x .\SimpleDNSCryptPlus-x64-${{ needs.build.outputs.version }}-portable.zip.minisig `
              -p .\update.pub
            ```

            Or check the digest against `SHA256SUMS.txt`:
            ```
            Get-FileHash .\SimpleDNSCryptPlus-x64-${{ needs.build.outputs.version }}-portable.zip -Algorithm SHA256
            ```

            The in-app updater accepts only artifacts that this key signs.

            ### These binaries are NOT Authenticode-signed
            There is no code-signing certificate. Expect a SmartScreen prompt, and expect some
            antivirus products to report false positives: the app writes per-interface DNS settings
            under HKLM and bundles a Go binary. This is a deliberate trade-off, not an oversight -
            see `SECURITY.md`.

            ### Includes
            dnscrypt-proxy ${{ needs.build.outputs.proxy_version }} fetched at build time and checked against the
            SHA-256 pinned in `tools/dnscrypt-proxy.lock.json`.

            ### Credits
            Original project by Christian Hermann (bitbeans), Simple DNSCrypt up to 0.7.1, and his
            [minisign-net](https://github.com/bitbeans/minisign-net) library, which is what
            authenticates this channel.
            .NET 8 / MahApps 2 migration carried by instant.sc up to 0.8.2.
            This fork is independent and is not affiliated with or endorsed by either, or by the
            DNSCrypt organization.
