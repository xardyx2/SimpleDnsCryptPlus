name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  portable:
    name: portable (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: x86
            rid: win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SimpleDnsCrypt.sln

      - name: Build
        run: dotnet build SimpleDnsCrypt.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test Tests/Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Assert the test run was not empty
        shell: pwsh
        run: |
          $trxPath = 'TestResults/results.trx'
          if (-not (Test-Path $trxPath)) {
            throw "no TRX produced at $trxPath - the test step did not run"
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $failed = [int]$counters.failed
          Write-Host "tests: total=$total failed=$failed passed=$([int]$counters.passed)"
          # A skipped or mis-wired test project exits 0 with zero tests, which is not a green build.
          if ($total -le 0) {
            throw "test run reported 0 tests; the suite is not actually gating this pipeline"
          }
          if ($failed -gt 0) {
            throw "$failed test(s) failed"
          }

      - name: Fetch digest-pinned dnscrypt-proxy binaries
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build/fetch-proxy.ps1 -Arch ${{ matrix.arch }}

      - name: Build portable zip
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File build/build-portable.ps1
          -Arch ${{ matrix.arch }} -Version 0.0.0

      - name: Report artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.zip | ForEach-Object {
            Write-Host ("{0} = {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }
          Get-Content artifacts/SHA256SUMS-*.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
